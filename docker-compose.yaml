services:
  retirement-planner:
    build: .
    image: retirement-planner
    container_name: retirement-planner
    restart: unless-stopped
    ports:
      - "8502:8502"
    volumes:
      - ./scenarios:/app/scenarios
      - .:/app
    command: streamlit run app.py --server.port=8502 --server.address=0.0.0.0
